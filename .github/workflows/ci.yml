name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Build with clearly fake values: the build must not need real secrets
      # or a reachable database.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          AUTH_SECRET: ci-secret-not-real
          AUTH_URL: http://localhost:3000
          CLOUDINARY_CLOUD_NAME: ci-not-real
          CLOUDINARY_API_KEY: ci-not-real
          CLOUDINARY_API_SECRET: ci-not-real
          NEXT_TELEMETRY_DISABLED: "1"
