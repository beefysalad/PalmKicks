name: Create Production PR

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "main"
          destination_branch: "prod"
          pr_title: "Deploy main to production"
          pr_body: |
            ##  Automated Production Deployment
            
            This PR deploys changes from `main` to `prod` branch.
            
            ###  Pre-Deployment Checklist
            - [ ] All tests are passing
            - [ ] Code has been reviewed
            - [ ] No breaking changes or migrations needed
            - [ ] Environment variables are up to date
            
            ###  Changes
            Review the **Files changed** tab to see all modifications included in this deployment.
            
            ###  Deployment Notes
            - Ensure the production database is backed up before merging
            - Verify all environment configurations are correct
            - Monitor logs after deployment
            
            ---
            **Once reviewed and approved, merge this PR to deploy to production.**
          github_token: ${{ secrets.GITHUB_TOKEN }}
